name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore release.keystore -alias futo_key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FUTO, OU=Dev, O=FUTO, L=City, S=State, C=US"
          mv release.keystore android-native/app/

      - name: Configure Signing
        run: |
          cat >> android-native/app/build.gradle.kts << 'EOT'
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "123456"
                      keyAlias = "futo_key"
                      keyPassword = "123456"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          EOT

      - name: Build Release APK
        working-directory: android-native
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-theme-studio-release
          path: android-native/app/build/outputs/apk/release/app-release.apk
