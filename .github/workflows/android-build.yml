name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Engine
        run: |
          npm install
          npm run build

      - name: Copy Web Assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp -r dist/* android-native/app/src/main/assets/www/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        working-directory: android-native
        run: |
          # بناء النسخة الموقعة (Release)
          gradle assembleRelease --no-daemon

      - name: Sign APK (Debug Signing for Release)
        run: |
          # استخدام أدوات الأندرويد لتوقيع الـ APK
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          
          # نسخ الملف الأصلي
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk android-native/app/build/outputs/apk/release/app-release-signed.apk
          
          # توقيع الملف (باستخدام مفتاح التصحيح الافتراضي أو المفتاح الذي أنشأناه)
          $APKSIGNER sign --ks android-native/release.keystore --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias futo_key android-native/app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-theme-studio-release
          path: android-native/app/build/outputs/apk/release/app-release-signed.apk
