name: Build APK (Native Kotlin)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (لبناء المحرك الويب)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Engine
        run: |
          npm install
          npm run build

      - name: Copy Web Engine to Android Assets
        run: |
          mkdir -p android-native/app/src/main/assets/www
          cp -r dist/* android-native/app/src/main/assets/www/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        working-directory: android-native
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-native-studio-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
